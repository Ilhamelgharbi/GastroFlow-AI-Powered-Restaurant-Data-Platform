version: 2

sources:
  - name: raw
    database: "{{ env_var('GCP_PROJECT_ID') }}"
    schema: gastroflow_raw
    tables:
      - name: restaurants
      - name: users
      - name: food
      - name: menu
      - name: orders
      - name: order_items
      - name: reviews

  # Reserved for future review enrichment; the local Airflow DAG excludes AI models.
  - name: ai
    database: "{{ env_var('GCP_PROJECT_ID') }}"
    schema: "{{ env_var('BQ_AI_DATASET', 'gastroflow_ai') }}"
    tables:
      - name: review_enriched