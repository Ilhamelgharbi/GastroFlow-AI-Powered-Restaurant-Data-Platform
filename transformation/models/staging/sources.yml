version: 2

sources:
  - name: raw
    database: "{{ env_var('GASTROFLOW_PROJECT_ID', env_var('GCP_PROJECT_ID', '')) }}"
    schema: "{{ env_var('GASTROFLOW_BQ_RAW_DATASET', env_var('BQ_RAW_DATASET', 'gastroflow_raw')) }}"
    tables:
      - name: restaurants
      - name: users
      - name: food
      - name: menu
      - name: orders
      - name: order_items
      - name: reviews

  # Reserved for future review enrichment; the current DAG excludes AI models.
  - name: ai
    database: "{{ env_var('GASTROFLOW_PROJECT_ID', env_var('GCP_PROJECT_ID', '')) }}"
    schema: "{{ env_var('GASTROFLOW_BQ_AI_DATASET', env_var('BQ_AI_DATASET', 'gastroflow_ai')) }}"
    tables:
      - name: review_enriched